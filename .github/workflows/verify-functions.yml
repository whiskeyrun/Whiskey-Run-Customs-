name: Verify storefront functions
on:
  push:
    branches: [main]
    paths:
      - 'netlify/functions/**'
      - 'catalog-loader.js'
      - '.github/workflows/verify-functions.yml'
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check catalog-loader.js
          for file in netlify/functions/*.mjs; do node --check "$file"; done
