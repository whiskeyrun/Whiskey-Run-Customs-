<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whiskey Run Customs | Product Manager</title>
<style>:root{font-family:system-ui,Arial;color:#f6ead8;background:#171713}*{box-sizing:border-box}body{margin:0}header{background:#29251f;border-bottom:2px solid #ba853d;padding:22px 18px}h1{font-family:Georgia;margin:0;font-size:26px}header p{margin:8px 0 0;color:#d6bd94}main{max-width:760px;margin:auto;padding:18px}section{background:#25241f;border:1px solid #62513a;border-radius:15px;padding:22px;margin:18px 0}label{display:block;margin:14px 0 6px;font-weight:650}input,textarea{width:100%;padding:14px;font:inherit;border:1px solid #85785f;border-radius:8px;background:#fff;color:#161616}textarea{min-height:110px}button{font:inherit;border:0;border-radius:9px;padding:13px 17px;background:#bf873d;color:#171713;font-weight:750;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#49443a;color:#fff}button.danger{background:#873f37;color:#fff}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.hidden{display:none}#status{white-space:pre-wrap;color:#e6c994;min-height:22px}img.preview{width:100%;max-width:280px;max-height:230px;object-fit:contain;border-radius:8px;background:#161616}.item{border-top:1px solid #64513c;padding:15px 0}.item img{width:85px;height:85px;object-fit:cover;border-radius:8px}.item strong{display:block}small{color:#d6bd94}a{color:#e7bd7c}</style></head><body>
<header><h1>Whiskey Run Customs</h1><p>Owner's product dashboard</p></header><main>
<section id="login"><h2>Owner sign in</h2><p>Use your Supabase Authentication user email and password. This may differ from your Supabase website account password.</p><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><p><button type="submit">Sign in</button></p></form></section>
<div id="workspace" class="hidden"><section><div class="row" style="justify-content:space-between"><h2>Manage products</h2><button class="secondary" id="signout">Sign out</button></div><p>Choose a photo, enter the details, then tap Save product.</p><form id="productForm"><input type="hidden" id="productId"><label>Product name</label><input id="name" maxlength="150" required placeholder="e.g. Personalized slate coaster"><label>Description</label><textarea id="description" required placeholder="Tell customers about this product"></textarea><label>Price in dollars (0 for custom quote)</label><input id="price" type="number" min="0" max="100000" step="0.01" value="0" required><label>Product photo</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><p><img id="preview" class="preview hidden" alt="Product preview"></p><label class="row"><input id="available" type="checkbox" checked style="width:auto"> Show on website</label><p class="row"><button id="save" type="submit">Save product</button><button id="clear" type="button" class="secondary">New product</button></p></form></section><section><h2>Your products</h2><div id="productList">Loading…</div></section></div>
<p id="status" role="status" aria-live="polite"></p><p><a href="/">Back to store</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const SUPABASE_URL = 'https://vaksbwntwarmyidkudcf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5LTFwcF5Cprv4GXd9K0bOQ_LWlpcwWD';

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id), status=msg=>$('status').textContent=msg;
const ownerEmail='whiskeyrun14@outlook.com';
let currentUser=null, rows=[];
function allowed(user){return !!user && user.email?.toLowerCase()===ownerEmail;}
function setLoggedIn(user){currentUser=allowed(user)?user:null;$('login').classList.toggle('hidden',!!currentUser);$('workspace').classList.toggle('hidden',!currentUser);if(user&&!currentUser)status('This account is not authorized to manage products.');if(currentUser)loadProducts();}
async function init(){const {data,error}=await db.auth.getUser();if(error)status(error.message);setLoggedIn(data?.user);}
$('loginForm').onsubmit=async e=>{e.preventDefault();status('Signing in…');const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){status(error.message);return;}status('');setLoggedIn(data.user);};
$('signout').onclick=async()=>{await db.auth.signOut();setLoggedIn(null);status('Signed out.');};
$('photo').onchange=()=>{const f=$('photo').files[0];if(!f)return;const url=URL.createObjectURL(f);$('preview').src=url;$('preview').classList.remove('hidden');$('preview').onload=()=>URL.revokeObjectURL(url);};
function resetForm(){$('productForm').reset();$('productId').value='';$('preview').src='';$('preview').classList.add('hidden');$('save').textContent='Save product';}
$('clear').onclick=resetForm;
async function loadProducts(){const {data,error}=await db.from('products').select('id,name,description,price,image_url,available').order('id',{ascending:false});if(error){status('Unable to load products: '+error.message);return;}rows=data||[];const root=$('productList');root.replaceChildren();if(!rows.length){root.textContent='No products yet. Add your first one above.';return;}rows.forEach(p=>{const div=document.createElement('div');div.className='item';const wrap=document.createElement('div');wrap.className='row';if(p.image_url){const img=document.createElement('img');img.src=p.image_url;img.alt='';wrap.append(img);}const details=document.createElement('div');const name=document.createElement('strong');name.textContent=p.name;const meta=document.createElement('small');meta.textContent=(p.price>0?'$'+Number(p.price).toFixed(2):'Custom quote')+(p.available?' · Visible':' · Hidden');details.append(name,meta);wrap.append(details);div.append(wrap);const actions=document.createElement('p');actions.className='row';const edit=document.createElement('button');edit.textContent='Edit';edit.className='secondary';edit.onclick=()=>{ $('productId').value=p.id;$('name').value=p.name;$('description').value=p.description||'';$('price').value=p.price;$('available').checked=!!p.available;$('preview').src=p.image_url||'';$('preview').classList.toggle('hidden',!p.image_url);$('save').textContent='Update product';window.scrollTo({top:0,behavior:'smooth'});};const del=document.createElement('button');del.textContent='Delete';del.className='danger';del.onclick=async()=>{if(!confirm('Delete '+p.name+'?'))return;const {error}=await db.from('products').delete().eq('id',p.id);if(error)status(error.message);else{status('Product deleted.');loadProducts();}};actions.append(edit,del);div.append(actions);root.append(div);});}
$('productForm').onsubmit=async e=>{e.preventDefault();if(!currentUser)return;const save=$('save');save.disabled=true;status('Saving product…');try{let image_url=rows.find(p=>String(p.id)===$('productId').value)?.image_url||null;const file=$('photo').files[0];if(file){if(file.size>8*1024*1024)throw Error('Photo must be smaller than 8 MB.');if(!['image/jpeg','image/png','image/webp','image/avif'].includes(file.type))throw Error('Choose a JPG, PNG, WebP, or AVIF image.');const path=`products/${crypto.randomUUID()}.${file.type.split('/')[1]==='jpeg'?'jpg':file.type.split('/')[1]}`;const uploaded=await db.storage.from('Product-images').upload(path,file,{contentType:file.type,upsert:false});if(uploaded.error)throw uploaded.error;image_url=db.storage.from('Product-images').getPublicUrl(path).data.publicUrl;}
const payload={name:$('name').value.trim(),description:$('description').value.trim(),price:Number($('price').value),image_url,available:$('available').checked};if(!payload.name||!payload.description||!Number.isFinite(payload.price)||payload.price<0)throw Error('Please enter valid product details.');const id=$('productId').value;const res=id?await db.from('products').update(payload).eq('id',id).select('id'):await db.from('products').insert(payload).select('id');if(res.error)throw res.error;status('Product saved successfully.');resetForm();await loadProducts();}catch(err){status('Could not save: '+err.message);}finally{save.disabled=false;}};
init();
</script></body></html>
